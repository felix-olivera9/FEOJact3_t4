<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CRUD de Productos y Categorías</title>
</head>
<body>
    <h1>Gestión de Productos y Categorías</h1>

    <!-- Formulario para Registrar / Actualizar Producto -->
    <fieldset>
        <legend>Formulario de Producto</legend>
        <form action="#" th:action="@{/productos/guardar}" th:object="${productoForm}" method="post">
            <input type="hidden" th:field="*{id}"/>
            
            <label>Nombre del Producto:</label>
            <input type="text" th:field="*{nombre}" required/><br><br>

            <label>Precio:</label>
            <input type="number" step="0.01" th:field="*{precio}" required/><br><br>

            <label>Categoría:</label>
            <select th:field="*{categoria}" required>
                <option value="">Seleccione una categoría</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select><br><br>

            <button type="submit">Guardar</button>
            <a href="/productos">Cancelar</a>
        </form>
    </fieldset>

    <hr>

    <!-- Tabla de Listado -->
    <h2>Lista de Productos</h2>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría (Relación)</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.nombre}">Laptop</td>
                <td th:text="${p.precio}">15000</td>
                <td th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}">Electrónica</td>
                <td>
                    <a th:href="@{/productos/editar/{id}(id=${p.id})}">Editar</a> |
                    <a th:href="@{/productos/eliminar/{id}(id=${p.id})}">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
